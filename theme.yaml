# The terminal theme: a technical blog in a terminal - a prompt in the
# header, monospace headings, dates and tags, lists in rows divided by
# dashed lines, code blocks with highlighting, their language and a copy
# button, the contents of a long text beside it; a palette of the
# accent, the links and the background chosen on the Appearance page, a
# dark and a light scheme. It keeps the engine's regions, so blocks
# placed for the engine's look stay where they are.
name: Terminal
# favicon - the theme's icon (the site's, uploaded on Site information,
# replaces it).
favicon: /static/themes/terminal/images/terminal-icon.svg
# The theme's description (Appearance page; entity.ThemeInfo).
description: A technical blog in a terminal - a prompt in the header, monospace headings and dates, code blocks with highlighting and a copy button, the contents of a long text, colour palettes, a dark and a light scheme.
author: Kosatka
license: MIT
# version - this release (the tag vX.Y.Z without its "v"); min_version -
# the oldest engine release the theme works with.
version: 0.1.1
min_version: 0.1.0
homepage: https://github.com/kosatka-cms/kosatka-theme-terminal
tags: [dark, light, monospace, blog, responsive]
screenshot: screenshot.jpg
# default_region - where new blocks go.
default_region: sidebar
regions:
  - id: header
    label: Header
  # The whole sidebar is one region (sidebar.html), ordered by weight.
  - id: sidebar
    label: Sidebar
  # Between the page's title and its content.
  - id: content_top
    label: Content top
  - id: content_bottom
    label: Content bottom
  # Inside the node page (dynamic/page.html, forum/topic.html).
  - id: content_inline
    label: Inside content (content page)
  - id: footer
    label: Footer
  # The footer's last line (the copyright block on a new site).
  - id: footer_bottom
    label: Footer bottom line
# blocks - the blocks the theme comes with (entity.ThemeBlock): placed
# when the theme gets its layout for the first time, unless the layout
# has them.
blocks:
  - plugin: copyright
    region: footer_bottom
# settings - the theme's options on the Appearance page
# (entity.ThemeSetting). The palette and the font are attributes of
# <html> (partials/theme_head.html), terminal.css has their colours.
settings:
  - id: palette
    label: Palette
    type: select
    default: amber
    options:
      - value: amber
        label: Amber
      - value: phosphor
        label: Green phosphor
      - value: ice
        label: Ice
      - value: rose
        label: Rose
  - id: scheme
    label: Colour scheme by default
    type: select
    default: dark
    options:
      - value: dark
        label: Dark
      - value: light
        label: Light
      - value: auto
        label: As on the visitor's device
  - id: text_font
    label: The text's font
    type: select
    default: sans
    options:
      - value: sans
        label: Proportional
      - value: mono
        label: Monospace
  - id: prompt
    label: The header's prompt (the site's name when empty)
    type: text
    max_length: 60
  - id: toc
    label: The contents of a text with three headings or more
    type: bool
    default: true
  - id: guest_links
    label: Logging in and registration in the header
    type: bool
    default: true
